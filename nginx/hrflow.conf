# =============================================================================
# NovaTech HRFlow — configuration Nginx durcie
#
# Remplace la configuration de 2021, jamais revue, qui présentait :
#   SEC-14  trafic en HTTP clair, aucune redirection HTTPS, aucun certificat ;
#   SEC-15  /logs/ exposé publiquement avec `autoindex on` — or les journaux
#           contenaient e-mails, rôles et mots de passe réinitialisés ;
#   SEC-16  staging accessible sans authentification, sur le même serveur ;
#   SEC-17  aucun en-tête de sécurité ;
#   INF-09  aucune limite de taille de corps, aucun délai d'expiration.
# =============================================================================

# ----------------------------------------------------------------------------
# Limitation de débit — défense de premier niveau, avant même l'application
# ----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=connexion:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=connexions:10m;

# Journalisation sans donnée personnelle superflue et avec identifiant de
# corrélation, pour pouvoir relier une trace Nginx à une trace applicative.
log_format hrflow escape=json
  '{"ts":"$time_iso8601","ip":"$remote_addr","methode":"$request_method",'
  '"chemin":"$uri","statut":$status,"octets":$body_bytes_sent,'
  '"duree":$request_time,"requestId":"$http_x_request_id","ua":"$http_user_agent"}';

# ----------------------------------------------------------------------------
# HTTP — uniquement pour rediriger et répondre au défi ACME
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name hrflow.novatech.io staging.hrflow.novatech.io;

    # Renouvellement automatique des certificats.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# PRODUCTION
# ----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hrflow.novatech.io;

    ssl_certificate     /etc/letsencrypt/live/hrflow.novatech.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrflow.novatech.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    access_log /var/log/nginx/hrflow.access.log hrflow;
    error_log  /var/log/nginx/hrflow.error.log warn;

    # --- En-têtes de sécurité (SEC-17) --------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # Ne pas annoncer la version du serveur.
    server_tokens off;

    # --- Limites (INF-09) ----------------------------------------------------
    # 6 Mo : la limite applicative de téléversement est de 5 Mo, plus la marge
    # d'encodage multipart. Sans cette limite, un seul appelant sature le disque.
    client_max_body_size 6m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_conn connexions 20;

    # --- Frontend ------------------------------------------------------------
    location / {
        root /var/www/hrflow/dist;
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # --- API -----------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # La mise en cache d'une réponse d'API contenant des données RH serait
        # une fuite entre utilisateurs.
        proxy_buffering off;
        proxy_cache off;
    }

    # --- Authentification : limitation plus stricte (SEC-13) ------------------
    location /api/auth/login {
        limit_req zone=connexion burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
    }

    # --- Sonde de disponibilité ----------------------------------------------
    # Accessible sans authentification, mais restreinte au réseau de supervision.
    location = /health/ready {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3000/health/ready;
    }

    # --- SEC-15 : le bloc /logs/ a été SUPPRIMÉ -------------------------------
    #
    # L'ancienne configuration servait /var/log/hrflow/ avec `autoindex on`.
    # N'importe qui pouvait lister puis télécharger les journaux applicatifs,
    # qui contenaient des adresses e-mail, des rôles et — depuis la route de
    # réinitialisation — des mots de passe en clair.
    #
    # Les journaux sont désormais collectés par l'agent de supervision et ne
    # sont jamais servis par HTTP. Toute tentative d'accès est refusée :
    location /logs/ {
        deny all;
        return 404;
    }

    # Refus des fichiers sensibles éventuellement déposés par erreur.
    location ~ /\.(env|git|ssh) {
        deny all;
        return 404;
    }
}

# ----------------------------------------------------------------------------
# STAGING — isolé et authentifié (SEC-16, INF-07)
#
# L'incident de juin 2024 vient d'un staging ouvert, sur la même machine et la
# même configuration que la production. Ici : authentification obligatoire,
# indexation interdite, et — dans l'architecture cible — machine et base
# distinctes (voir docker/docker-compose.staging.yml).
# ----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.hrflow.novatech.io;

    ssl_certificate     /etc/letsencrypt/live/staging.hrflow.novatech.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.hrflow.novatech.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/staging.access.log hrflow;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Un environnement de test ne doit jamais apparaître dans un moteur de recherche.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 6m;

    # Authentification HTTP en amont de l'application : le staging n'est pas
    # accessible sans identifiants, même si l'application y est ouverte.
    auth_basic "HRFlow — environnement de recette";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    # Restriction supplémentaire au réseau de l'entreprise et au VPN.
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;

    location / {
        root /var/www/hrflow-staging/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
    }
}
