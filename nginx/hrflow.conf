# Config Nginx NovaTech HRFlow
# Créée en 2021 — jamais revue

server {
    listen 80;
    server_name hrflow.novatech.io;

    # Pas de redirection HTTPS — HTTP en clair accepté !!!
    # TODO: configurer SSL (Théo, 2022) — jamais fait

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        # Pas de headers de sécurité (CSP, HSTS, X-Frame-Options...)
    }

    # Répertoire de logs accessible publiquement — fuite d'infos
    location /logs/ {
        alias /var/log/hrflow/;
        autoindex on; # liste les fichiers de log !!!
    }
}

# Staging sur le même serveur, même config
server {
    listen 80;
    server_name staging.hrflow.novatech.io;

    # Pas d'authentification sur le staging
    # Incident de juin 2024 causé par ça !!!

    location / {
        proxy_pass http://localhost:3100;
    }
}
