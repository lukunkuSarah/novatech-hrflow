# Service des fichiers statiques du frontend, à l'intérieur du conteneur.
# Le reverse proxy public (TLS, limitation de débit) est décrit dans
# nginx/hrflow.conf ; ici on ne sert que l'application construite.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Application monopage : toute route inconnue renvoie l'index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers versionnés par empreinte peuvent être mis en cache longtemps.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # L'index ne doit jamais être mis en cache : c'est lui qui référence les
    # nouvelles empreintes après un déploiement.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
